*{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1F;--surface:#13252C;--ink:#E4EFED;--muted:#8FA6AC;

}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Alexandria","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
.top{padding:12px 4px 8px}
h1{font-size:2.6rem;font-weight:800;margin:0;line-height:1.15;color:var(--sea)}
.sub{color:var(--muted);margin:6px 0 20px;font-size:.95rem}
.tide{position:relative;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.tide i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:var(--glass);border-radius:999px;transition:width .5s ease}
.tide-text{display:flex;justify-content:space-between;margin-top:8px;font-size:.9rem;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.status{margin-inline-start:auto;font-size:.82rem;color:var(--muted)}
.area{margin-top:30px}
.area h2{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:600;margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.area.complete h2{border-color:var(--sun)}
.area h2 .count{margin-inline-start:auto;font-size:.85rem;color:var(--muted);font-weight:400;white-space:nowrap}
.area h2 input{flex:1;min-width:0}
ul{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item label{display:flex;gap:12px;align-items:flex-start;flex:1;cursor:pointer;min-height:32px}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:3px 0 0;border:2px solid var(--glass);border-radius:50%;display:grid;place-content:center;background:transparent;cursor:pointer;transition:background .15s}
.item input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--on-sea);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
.item input[type=checkbox]:checked{background:var(--glass)}
.item input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.item input[type=checkbox]:disabled{cursor:default;opacity:.7}
.done .txt{text-decoration:line-through;color:var(--muted)}
.field{font:inherit;font-size:16px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:0}
.item .field{flex:1}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.add{display:flex;gap:8px;margin-top:12px}
.add .field{flex:1}
.go{border:0;border-radius:12px;padding:0 18px;background:var(--sea);color:var(--on-sea);font-weight:600;white-space:nowrap}
.del{border:0;background:transparent;color:var(--red);font-size:.85rem;padding:6px 8px;white-space:nowrap}
.empty{color:var(--muted);font-size:.9rem;padding:10px 2px;margin:0}
.newsec{margin-top:40px}
.newsec h2{font-size:1rem;font-weight:600;color:var(--muted);margin:0 0 4px;border:0}
.foot{margin-top:40px;color:var(--muted);font-size:.82rem;text-align:center}
.pen{border:0;background:transparent;color:var(--muted);padding:4px 8px;font-size:1rem;line-height:1;border-radius:8px;flex:none}
.pen:hover{color:var(--sea)}
.editbox{display:flex;flex-direction:column;gap:8px;flex:1;padding:4px 0}
.editbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.editbox .field{width:100%}
.editbox .emoji{width:3.4em;text-align:center;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 14px}
.editbox .go{padding:8px 18px}
.editbox .del{margin-inline-start:auto}
.area h2 .pen{font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function(){
  var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>أهدافي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet"><meta name="theme-color" content="#0F5465">';
  var LS='ahdafi-v1';
  var STATUS={loading:'',saving:'بيحفظ…',saved:'محفوظ ✓',local:'محفوظ على الجهاز ده بس',readonly:'للقراية بس',error:'ماتحفظش، جرّب تاني'};
  var root=document.getElementById('root');
  var state;
  try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){state={updated:0,sections:[]}}
  if(!state.sections)state.sections=[];
  var art=null,artReady=false,dirty=false,timer=null,readOnly=false,editId=null,hideDone=false,status='loading',retried=false,refocus=null;
  try{hideDone=localStorage.getItem(LS+':hide')==='1'}catch(e){}

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  function buildDoc(){

    var data=JSON.stringify(state).replace(/</g,'\\u003c');

  }

  }

  function startEdit(id){editId=id;refocus='edit-'+id;render()}

  function editBox(id,value,onSave,onDelete,delLabel,extra){

      });
      var section=el('section',{class:'area'+(complete?' complete':'')},[h2,list]);
      if(!visible.length){
        section.appendChild(el('p',{class:'empty',text:sec.items.length?'كله خلص هنا 👏':'لسه مفيش أهداف هنا.'}));
